<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casa Cielo | Receipt</title>
    <link rel="stylesheet" href="invoice.css" />
  </head>
  <body>
    <div class="invoice-toolbar no-print">
      <button class="btn btn-secondary" type="button" onclick="history.back()">Back</button>
      <button class="btn btn-primary" type="button" id="printBtn">Print Receipt</button>
    </div>

    <p id="receiptError" class="invoice-error no-print" hidden>Receipt not found.</p>

    <div class="invoice-sheet" id="receiptSheet">
      <img class="invoice-header-img" src="assets/letterhead-header.jpg" alt="Casa Cielo Co-operative Housing Society Limited" />

      <div class="invoice-body">
        <img class="invoice-watermark" src="assets/logo.png" alt="" />

        <div class="invoice-meta">
          <div>
            <span>Receipt #</span>
            <strong id="rcptNumber">-</strong>
          </div>
          <div>
            <span>Date</span>
            <strong id="rcptDate">-</strong>
          </div>
        </div>

        <h3>Received From</h3>
        <table class="invoice-table">
          <tr><td>Name</td><td id="rcptName">-</td></tr>
          <tr><td>Flat</td><td id="rcptFlat">-</td></tr>
          <tr><td>Wing</td><td id="rcptWing">-</td></tr>
        </table>

        <h3>Contribution Details</h3>
        <table class="invoice-table">
          <thead>
            <tr><th>Description</th><th>Amount</th></tr>
          </thead>
          <tbody id="rcptLineItems"></tbody>
          <tfoot>
            <tr class="invoice-total-row"><td>Total Received</td><td id="rcptTotal">-</td></tr>
          </tfoot>
        </table>

        <p id="rcptNote" class="invoice-purpose"></p>
      </div>

      <img class="invoice-footer-img" src="assets/letterhead-footer.jpg" alt="Casa Cielo Survey No. 149/1 and 150/10, F-Wing-003, Palava Phase-2, Lakeshore Green" />
    </div>

    <script src="receipt.js"></script>
  </body>
</html>
