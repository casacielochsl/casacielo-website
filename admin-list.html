<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casa Cielo | Admin List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="brand-mark">C</span>
        <span>Casa Cielo</span>
      </a>
      <nav class="nav-links" aria-label="Admin list navigation">
        <a href="index.html">Home</a>
        <a href="members.html">Member Portal</a>
        <a href="admin.html" class="active">Admin</a>
      </nav>
    </header>

    <main class="admin-shell">
      <section class="admin-card">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Admin Access</p>
            <h1>Member List</h1>
          </div>
          <div class="panel-actions">
            <a class="btn btn-primary" href="admin-management?mode=create">Create</a>
            <a class="btn btn-secondary" href="admin.html">Back to Login</a>
          </div>
        </div>

        <div class="filter-bar">
          <label class="field field-inline">
            <span>Search</span>
            <input id="filterSearch" type="text" placeholder="Flat, name, wing, type" />
          </label>
          <label class="field field-inline">
            <span>Type</span>
            <select id="filterType">
              <option value="">All</option>
              <option value="Owner">Owner</option>
              <option value="Co-Owner">Co-Owner</option>
              <option value="Family Member">Family Member</option>
            </select>
          </label>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Flat</th>
                <th>Name</th>
                <th>Wing</th>
                <th>Floor</th>
                <th>Type</th>
                <th>Contact</th>
                <th>Password</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="memberTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="admin-list.js"></script>
  </body>
</html>
