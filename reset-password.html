<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casa Cielo | Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">
        <img class="brand-mark" src="assets/logo.png" alt="Casa Cielo" />
        <span>Casa Cielo</span>
      </a>
      <nav class="nav-links" aria-label="Admin navigation">
        <a href="index.html">Home</a>
        <a href="members.html">Member Portal</a>
        <a href="admin.html" class="active">Admin</a>
      </nav>
    </header>

    <main class="admin-shell">
      <section class="admin-card">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Admin Access</p>
            <h1>Reset Password</h1>
          </div>
        </div>

        <form id="reset-password-form" class="admin-login">
          <label class="field">
            <span>New Password</span>
            <input id="newPassword" type="password" minlength="6" required />
          </label>
          <label class="field">
            <span>Confirm Password</span>
            <input id="confirmPassword" type="password" minlength="6" required />
          </label>
          <button class="btn btn-primary" type="submit">Reset Password</button>
        </form>

        <p id="resetMessage" class="form-hint" hidden></p>
      </section>
    </main>

    <script src="reset-password.js"></script>
  </body>
</html>
